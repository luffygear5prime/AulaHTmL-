<html>

<head>

    <title>Exercício 3</title>

    <style>
    h1
    {
        background-color: blueviolet;
        color: white;
        padding: 20px;
        text-align: center;
    }

    table, th, td
    {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 5px;
    }
</style>

</head>

<body>

    <h1>Aula 05 - Exercício 3 de tabelas</h1>

    <table>
        <tr>
            <th colspan="4">CARDÁPIO</th>
        </tr>
        <tr>
            <th>Categoria</th>
            <th>Produto</th>
            <th>Tamanho</th>
            <th>Preço</th>
        </tr>
        <tr>
            <th rowspan="3">Pizzas</th>
            <td>Muçarela</td>
            <td>Grande</td>
            <td>R$ 45,00</td>
        </tr>
        <tr>
            <td>Calabresa</td>
            <td>Grande</td>
            <td>R$ 48,00</td>
        </tr>
        <tr>
            <Td>Marguerita</Td>
            <td>Grande</td>
            <td>R$ 50,00</td>
        </tr>
        <tr>
            <th rowspan="2">Bebidas</th>
            <td>Refrigerante</td>
            <td>2 Litros</td>
            <td>R$ 12,00</td>
        </tr>
        <tr>
            <td>Suco</td>
            <td>1 Litro</td>
            <td>R$ 10,00</td>
        </tr>
        <tr>
            <th rowspan="3">Promoção: Pizza + Refrigerante</th>
        </tr>
    </table>
    
</body>

</html>
